name: Public Feedback Tunnel

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: How long to keep the public preview online
        required: false
        default: "240"

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ppbtuuyuramfezfoqfag.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TmLUbVIJFDped8WGWqsbRw_PTNTnKLC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Shiftly HR
        run: npm run build:web
      - name: Start Shiftly HR
        shell: bash
        run: |
          npm run start --workspace=@shiftly/admin-web > /tmp/shiftly-next.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/en/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/shiftly-next.log
          exit 1
      - name: Start public tunnel
        shell: bash
        run: |
          curl --fail --location --silent --show-error             https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64             --output /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          echo "TUNNEL_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            FEEDBACK_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$FEEDBACK_URL" ]; then
              echo "$FEEDBACK_URL" | tee feedback-url.txt
              {
                echo "### Shiftly HR public feedback link"
                echo "[$FEEDBACK_URL]($FEEDBACK_URL)"
                echo ""
                echo "This temporary link stays online while this workflow is running."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cloudflared.log
          exit 1
      - name: Upload feedback link
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-feedback-link
          path: feedback-url.txt
          retention-days: 1
      - name: Keep preview online
        shell: bash
        run: |
          MINUTES="${{ github.event.inputs.duration_minutes || '240' }}"
          echo "Keeping the preview online for $MINUTES minutes."
          timeout "$((MINUTES * 60))" bash -c '
            while kill -0 "$APP_PID" 2>/dev/null && kill -0 "$TUNNEL_PID" 2>/dev/null; do
              sleep 30
            done
          ' || true
