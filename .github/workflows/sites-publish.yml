name: Build Shiftly HR Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sites-publish.yml"
      - ".hosting/shiftly-hosting.bundle.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode verified source bundle
        run: base64 --decode .hosting/shiftly-hosting.bundle.b64 > /tmp/shiftly.bundle

      - name: Restore verified source
        run: git clone /tmp/shiftly.bundle /tmp/shiftly-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: /tmp/shiftly-site
        run: npm ci

      - name: Build Sites package
        working-directory: /tmp/shiftly-site
        run: npm run build

      - name: Package Sites archive
        run: tar -czf /tmp/shiftly-site.tar.gz -C /tmp/shiftly-site dist

      - name: Attach deployable archive
        run: |
          base64 -w 0 /tmp/shiftly-site.tar.gz > /tmp/shiftly-site.tar.gz.b64
          rm -f .hosting/shiftly-site.tar.gz.b64.part-*
          split -b 200000 -d -a 2 /tmp/shiftly-site.tar.gz.b64 .hosting/shiftly-site.tar.gz.b64.part-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .hosting/shiftly-site.tar.gz.b64.part-*
          git commit -m "chore(hosting): attach deployable preview archive [skip ci]"
          git push

      - name: Upload Sites archive
        uses: actions/upload-artifact@v4
        with:
          name: shiftly-site-archive
          path: /tmp/shiftly-site.tar.gz
          retention-days: 1
          if-no-files-found: error
