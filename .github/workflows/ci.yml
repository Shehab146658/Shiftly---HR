name: CI

on:
  pull_request:
  push:
    branches: [main, "milestone/**"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/static-check.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example_for_build_only_1234567890

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx supabase start -x studio,imgproxy,logflare,vector
      - run: npx supabase db reset
      - run: npx supabase db lint --local --level warning
      - run: npx supabase test db

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/employee-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --org com.shiftly.hr --project-name shiftly_employee .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
